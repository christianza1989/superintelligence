name: Zero offline foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  durability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install and generate database types
        run: |
          npm run setup
          npm run db:generate
      - name: Prepare the explicit PostgreSQL image for this qualification
        run: docker pull postgres:18.6
      - name: Qualify the named durability matrix in an owned disposable database
        run: npm run qualify:durability
      - name: Reject a terminal commit blocked beyond its lease expiry
        run: node platform/scripts/qualify-zero-durability.mjs --expiry-lock
      - name: Qualify explicit quiesced native backup and verified restore
        run: |
          export ZERO_NATIVE_BACKUP_POSTGRES_IMAGE_ID="$(docker image inspect --format '{{.Id}}' postgres:18.6)"
          npm run qualify:native:backup
      - name: Check database and testkit types
        run: node scripts/platform.mjs --filter @rakazo/db --filter @rakazo/testkit check
      - name: Preserve qualification reports including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: durability-reports
          path: |
            platform/.local/durability-qualification/*/qualification*.json
            platform/.local/native-backup-qualification/*/qualification.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install the frozen workspace without lifecycle scripts
        run: npm run setup
      - name: Generate local database types without connecting to a database
        run: npm run db:generate
      - name: Check documentation and selected package types
        run: |
          npm run check:docs
          npm run check:zero
      - name: Run offline foundation, MCP and observer regressions
        run: |
          npm run test:foundation -- --maxWorkers=2
          npm run test:library -- --maxWorkers=2
          npm run test:mcp -- --maxWorkers=2
          npm run test:mcp:execution -- --maxWorkers=2
          npm run test:observer -- --maxWorkers=2
          npm run test:scope -- --maxWorkers=2
          npm run test:worker -- --maxWorkers=2
          npm run test:jev -- --maxWorkers=2
          npm run test:jev:pricing
          npm run test:browser:foundation -- --maxWorkers=1
          npm run test:browser:sealed -- --maxWorkers=1
          npm run test:pdf:fixtures -- --maxWorkers=1
          npm run test:pdf:profile
          npm run test:pdf:runtime -- --maxWorkers=1
          npm run test:runtime:closure
          npm run test:runtime:profile
          npm run test:native:backup
          npm run test:docker:transport -- --maxWorkers=1
      - name: Build and exercise a self-contained discovery plugin
        run: |
          task_plugin_dir="$(node scripts/package-mcp-plugin.mjs)"
          node scripts/test-mcp-plugin.mjs "$task_plugin_dir"
      - name: Check the MCP launcher syntax
        run: |
          node --check scripts/zero-mcp.mjs
          node --check platform/scripts/zero-native-runtime-inventory.mjs
          node --check platform/scripts/zero-native-bundle-probe.mjs
          node --check platform/scripts/zero-native-runtime-package.mjs
          node --check platform/scripts/qualify-zero-native-backup.mjs

  csv-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: zero_fixture
          POSTGRES_PASSWORD: fixture_only_password
          POSTGRES_DB: zero_csv_test_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U zero_fixture -d zero_csv_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://zero_fixture:fixture_only_password@127.0.0.1:5432/zero_csv_test_ci
      ZERO_CSV_TEST_DATABASE_URL: postgresql://zero_fixture:fixture_only_password@127.0.0.1:5432/zero_csv_test_ci
      VERIFY_ZERO_CSV_DATABASE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install and generate database types
        run: |
          npm run setup
          npm run db:generate
      - name: Migrate the disposable fixture database
        run: npm run db:migrate
      - name: Check application and worker types
        run: node scripts/platform.mjs --filter @rakazo/api --filter @rakazo/worker check
      - name: Prepare the pinned network-isolated CSV verifier image
        run: |
          task_verifier_digest="node@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f"
          docker pull "$task_verifier_digest"
          task_verifier_id="$(docker image inspect --format '{{.Id}}' "$task_verifier_digest")"
          printf 'ZERO_CSV_PROJECT_IMAGE_ID=%s\n' "$task_verifier_id" >> "$GITHUB_ENV"
          printf 'VERIFY_ZERO_CSV_PROJECT_DOCKER=1\n' >> "$GITHUB_ENV"
      - name: Exercise real Graphile jobs and authenticated application routes
        run: |
          npm run test:csv:postgres -- --maxWorkers=1
          npm run test:csv:api -- --maxWorkers=1
          npm run test:csv:mcp
      - name: Exercise the Library handoff without starting a model worker
        env:
          DATABASE_URL: postgresql://zero_fixture:fixture_only_password@127.0.0.1:5432/zero_library_test_ci
          LIBRARY_HANDOFF_TEST_DATABASE_URL: postgresql://zero_fixture:fixture_only_password@127.0.0.1:5432/zero_library_test_ci
          VERIFY_LIBRARY_HANDOFF_DATABASE: "1"
          NODE_ENV: test
        run: |
          npm run db:migrate
          npm run test:library:postgres -- --maxWorkers=1
      - name: Exercise the Jev worker with an offline provider and a separate fixture ledger
        env:
          DATABASE_URL: postgresql://zero_fixture:fixture_only_password@127.0.0.1:5432/zero_jev_test_ci
          ZERO_JEV_TEST_DATABASE_URL: postgresql://zero_fixture:fixture_only_password@127.0.0.1:5432/zero_jev_test_ci
          VERIFY_ZERO_JEV_DATABASE: "1"
          NODE_ENV: test
        run: |
          npm run db:migrate
          npm run test:jev:postgres -- --maxWorkers=1
          npm run test:jev:api -- --maxWorkers=1
          npm run test:jev:composition
      - name: Preserve redacted MCP process qualification including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-process-qualification
          path: platform/.local/mcp-process-proof/*/qualification.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
