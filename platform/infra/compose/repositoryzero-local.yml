services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run init:local}
      POSTGRES_DB: ${POSTGRES_DB:?Run npm run init:local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run init:local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - repositoryzero_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  repositoryzero_pgdata:
