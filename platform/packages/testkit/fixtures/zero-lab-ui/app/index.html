<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SprintDesk controlled UI</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101210;color:#f4f6f0}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1200px;margin:auto}h1{margin-top:0}form{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:24px}label{display:grid;gap:6px}input,select,button{font:inherit;padding:10px;border:1px solid #65705c;border-radius:6px;background:#20251c;color:inherit}button{background:#b7f34c;color:#152006;font-weight:700}input{max-width:100%;width:280px}section.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}section.column{min-width:0}article{padding:16px;margin:12px 0;border:1px solid #65705c;border-radius:10px;overflow-wrap:anywhere}article h3{margin-top:0;font-size:16px}:focus-visible{outline:3px solid #b7f34c;outline-offset:3px}@media(max-width:600px){body{padding:16px}section.board{grid-template-columns:1fr}}
</style></head><body><main><h1>SprintDesk</h1><form aria-label="Create task"><label>Task title<input name="title" required maxlength="200"></label><button type="submit">Create task</button></form><p role="status"></p><section class="board"><section class="column" data-status="todo"><h2>Todo</h2><div></div></section><section class="column" data-status="doing"><h2>In progress</h2><div></div></section><section class="column" data-status="done"><h2>Done</h2><div></div></section></section></main><script src="/client.js" type="module"></script></body></html>
