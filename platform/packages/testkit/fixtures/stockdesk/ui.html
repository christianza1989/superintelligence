<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetic StockDesk control</title><link rel="icon" href="data:,"><style>*{box-sizing:border-box}body{font:16px system-ui;margin:auto;padding:16px;max-width:1100px;background:#fafafa;color:#171717}main{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}form,section{border:1px solid #aaa;padding:12px;min-width:0}label{display:block;margin:8px 0}input,select,textarea,button{font:inherit;max-width:100%;width:100%;padding:6px}input[type=checkbox]{width:auto}table{width:100%;table-layout:fixed;font-size:13px}td,th{overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere}h1,h2{margin:8px 0}[role=alert]{color:#a00}</style><h1>StockDesk control</h1><main><section><h2>Products</h2><form id="product"></form><label>Search products<input id="search"></label><label><input type="checkbox" id="low">Low stock only</label><button id="export">Export CSV</button><table aria-label="Inventory"><thead><tr><th>SKU</th><th>Name</th><th>Main</th><th>Reserve</th><th>Total</th><th>Minimum</th></tr></thead><tbody id="inventory"></tbody></table></section><section><form id="adjust"></form><form id="transfer"></form><form id="import"></form></section><section><h2>Movements</h2><pre id="history"></pre></section></main><script>
/*FAULT*/
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function form(id,fields,buttons){$(id).innerHTML=fields.map(([key,label,type,value])=>'<label>'+label+(type==='select'?'<select id="'+key+'"></select>':type==='textarea'?'<textarea id="'+key+'"></textarea>':'<input id="'+key+'" type="'+type+'" value="'+(value??'')+'">')+'</label>').join('')+buttons+'<p role="alert"></p><p class="success" aria-live="polite"></p>';}
form('product',[['sku','SKU','text'],['name','Product name','text'],['min','Minimum stock','number',0]],'<button>Add product</button>');
form('adjust',[['aref','Adjustment reference','text'],['asku','Adjustment SKU','select'],['warehouse','Warehouse','select'],['delta','Quantity change','number',1],['anote','Adjustment note','text']],'<button>Apply adjustment</button>');
form('transfer',[['tref','Transfer reference','text'],['tsku','Transfer SKU','select'],['from','From warehouse','select'],['to','To warehouse','select'],['quantity','Quantity','number',1],['tnote','Transfer note','text']],'<button>Transfer stock</button>');
form('import',[['csv','CSV input','textarea']],'<button type="button" id="preview">Preview import</button><button id="commit" disabled>Commit import</button><pre id="previewRows"></pre>');
for(const key of ['warehouse','from','to'])$(key).innerHTML='<option value="main">Main</option><option value="reserve">Reserve</option>';$('to').value='reserve';
async function api(route,body){if(window.NO_API&&body)return{};const r=await fetch(route,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{});const b=await r.json();if(!r.ok)throw Error(b.error);return b;}
async function refresh(){const all=(await api('/api/products')).products;for(const key of ['asku','tsku']){const value=$(key).value;$(key).innerHTML=all.map(p=>'<option value="'+esc(p.sku)+'">'+esc(p.sku)+'</option>').join('');if(all.some(p=>p.sku===value))$(key).value=value;}
const q=$('search').value.toLowerCase(),low=$('low').checked;const rows=all.filter(p=>(p.sku.toLowerCase().includes(q)||p.name.toLowerCase().includes(q))&&(!low||p.lowStock));$('inventory').innerHTML=rows.map(p=>'<tr>'+[p.sku,p.name,p.stock.main,p.stock.reserve,p.totalStock,p.minStock].map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('');$('history').textContent=JSON.stringify((await api('/api/movements')).movements,null,2);}
function submit(id,route,body){$(id).onsubmit=async e=>{e.preventDefault();const error=$(id).querySelector('[role=alert]');error.textContent='';try{await api(route,body());$(id).querySelector('.success').textContent='Saved';await refresh();}catch(e){error.textContent=e.message;}};}
submit('product','/api/products',()=>({sku:$('sku').value,name:$('name').value,minStock:Number($('min').value)}));submit('adjust','/api/adjustments',()=>({reference:$('aref').value,sku:$('asku').value,warehouse:$('warehouse').value,delta:Number($('delta').value),note:$('anote').value}));submit('transfer','/api/transfers',()=>({reference:$('tref').value,sku:$('tsku').value,from:$('from').value,to:$('to').value,quantity:Number($('quantity').value),note:$('tnote').value}));
$('csv').oninput=()=>{$('commit').disabled=true;};$('preview').onclick=async()=>{const form=$('import');form.querySelector('[role=alert]').textContent='';try{const p=await api('/api/import/preview',{csv:$('csv').value});$('previewRows').textContent=JSON.stringify(p,null,2);$('commit').disabled=!p.valid;}catch(e){form.querySelector('[role=alert]').textContent=e.message;}};
$('import').onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/import/commit',{csv:$('csv').value});$('import').querySelector('.success').textContent=JSON.stringify(r);$('commit').disabled=true;await refresh();}catch(e){$('import').querySelector('[role=alert]').textContent=e.message;}};
$('search').oninput=refresh;$('low').onchange=refresh;$('export').onclick=()=>{const a=document.createElement('a');a.href='/api/export';a.download='inventory.csv';a.click();};refresh();
</script></html>
